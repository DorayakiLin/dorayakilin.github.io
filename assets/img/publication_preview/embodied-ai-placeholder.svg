<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="title desc">
  <title id="title">Embodied AI publication placeholder</title>
  <desc id="desc">Abstract geometric cover used as a temporary publication preview image.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f2efe8"/>
      <stop offset="100%" stop-color="#d7e4f2"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#18314f"/>
      <stop offset="100%" stop-color="#245c73"/>
    </linearGradient>
  </defs>
  <rect width="480" height="320" fill="url(#bg)"/>
  <circle cx="102" cy="96" r="58" fill="#18314f" opacity="0.12"/>
  <circle cx="380" cy="78" r="42" fill="#9c6644" opacity="0.18"/>
  <rect x="42" y="40" width="396" height="240" rx="22" fill="white" opacity="0.92"/>
  <rect x="42" y="40" width="396" height="70" rx="22" fill="url(#panel)"/>
  <text x="66" y="84" fill="#f8f5ef" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700">Embodied AI</text>
  <text x="66" y="145" fill="#18314f" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700">Publication Preview</text>
  <text x="66" y="176" fill="#395b74" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14">Replace this image in</text>
  <text x="66" y="199" fill="#395b74" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14">assets/img/publication_preview/</text>
  <g fill="none" stroke="#245c73" stroke-linecap="round" stroke-width="8">
    <path d="M66 234c34-24 76-24 110 0s76 24 110 0 76-24 110 0"/>
    <path d="M92 254c26-18 58-18 84 0s58 18 84 0 58-18 84 0"/>
  </g>
</svg>
